name: AttoLang public interface contracts
on:
  push:
    branches: [dev]
    paths: ['atto/**', 'tests/atto_contracts.rs', 'schema/v1/notificationdispatch.json', '.github/workflows/atto-contracts.yml']
  pull_request:
    paths: ['atto/**', 'tests/atto_contracts.rs', 'schema/v1/notificationdispatch.json', '.github/workflows/atto-contracts.yml']
permissions:
  contents: read
jobs:
  rust-atto:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --test atto_contracts
      - run: cargo clippy --test atto_contracts -- -D warnings
