name: AttoLang public interface contracts
on:
  push:
    branches: [dev]
    paths: ['atto/**', 'scripts/check-atto-contracts.mjs', 'tests/atto-contracts.test.mjs', 'schema/v1/notificationdispatch.json', '.github/workflows/atto-contracts.yml']
  pull_request:
    paths: ['atto/**', 'scripts/check-atto-contracts.mjs', 'tests/atto-contracts.test.mjs', 'schema/v1/notificationdispatch.json', '.github/workflows/atto-contracts.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head, AttoLang contract parity and clean diff
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --test tests/atto-contracts.test.mjs
          git diff --check
