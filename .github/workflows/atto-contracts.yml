name: AttoLang public interface contracts
on:
  push:
    branches: [dev]
    paths: ['atto/**', 'scripts/check-atto-contracts.mjs', 'tests/atto-contracts.test.mjs', 'schema/v1/notificationdispatch.json', '.github/workflows/atto-contracts.yml']
  pull_request:
    paths: ['atto/**', 'scripts/check-atto-contracts.mjs', 'tests/atto-contracts.test.mjs', 'schema/v1/notificationdispatch.json', '.github/workflows/atto-contracts.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/atto-contracts.test.mjs
