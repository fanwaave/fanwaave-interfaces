name: fanwaave-config-contract

on:
  pull_request:
    paths:
      - "contracts/fanwaave-config/**"
      - "examples/.fanwaave-cfg.toml"
      - "docs/fanwaave-config.md"
      - ".github/workflows/fanwaave-config-contract.yml"
  push:
    branches: [main]
    paths:
      - "contracts/fanwaave-config/**"
      - "examples/.fanwaave-cfg.toml"
      - "docs/fanwaave-config.md"
      - ".github/workflows/fanwaave-config-contract.yml"

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Admit independent TypeSpec and JSON Schema authorities
        uses: ORESoftware/typespec-json-schema-validator@4a5d049218adc2740d4cf78f612caf7f38f6f64c
        with:
          typespec: contracts/fanwaave-config/fanwaave-config.tsp
          schema: contracts/fanwaave-config/fanwaave-config.schema.json
          report: .typespec-json-schema-validator/fanwaave-config-report.json
          output_dir: .typespec-json-schema-validator/fanwaave-config-generated
